[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-harness"
version = "0.1.0"
description = "ALICE: Artificial Logic and Intelligence Computation Engine. Ücretsiz API modelleriyle çalışan, bilgisayarı yönetebilen ajan harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "prompt_toolkit>=3",
    "psutil>=5.9",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
computer = [
    "mss>=9",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
browser = ["playwright>=1.45"]
app = ["pywebview>=5.1; sys_platform == 'win32' or sys_platform == 'darwin'"]
core = ["pystray>=0.19"]
voice = ["sounddevice>=0.4.6", "pynput>=1.7", "webrtcvad-wheels>=2.0.11"]
voice-local = ["faster-whisper>=1.0", "openwakeword>=0.6"]
all = ["alice-harness[computer,browser,app,core,voice]"]
dev = ["pytest>=8"]

[project.scripts]
alice = "alice.cli:main"

[tool.setuptools.packages.find]
include = ["alice*"]

[tool.setuptools.package-data]
"alice.app" = ["static/*"]
"alice.sims" = ["*.lua", "checklists/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
