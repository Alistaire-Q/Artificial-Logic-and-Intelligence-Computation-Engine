# Google Drive, Docs ve Sheets (tek Google girişiyle). Google Takvim'le aynı OAuth istemcisi kullanılır.
# 1) console.cloud.google.com → Takvim için açtığın projede "Google Drive API", "Google Docs API" ve
#    "Google Sheets API"yi etkinleştir
# 2) ~/.alice/.env'de GOOGLE_CLIENT_ID ve GOOGLE_CLIENT_SECRET zaten varsa ek bir şey gerekmez
# 3) alice connect google_workspace   (ya da Sistem → Bağlantılar → Google Workspace → Bağlan)
name = "google_workspace"
title = "Google Drive, Docs ve Sheets"
description = "Drive'da dosya arama ve okuma (Docs metin, Sheets CSV olarak); Google Docs belgesi oluşturma ve sonuna metin ekleme; Google Sheets tablosu oluşturma, aralık okuma, satır ekleme ve hücre güncelleme."
base_url = "https://www.googleapis.com"
keywords = "google drive|drive'da|drive'daki|google docs|google doküman|google belge|dokümanım|google sheets|e-?tablo|spreadsheet|sheets|tablomu|tabloya|google tablo"
docs = "https://developers.google.com/workspace"

[auth]
kind = "oauth2"
client_id_env = "GOOGLE_CLIENT_ID"
client_secret_env = "GOOGLE_CLIENT_SECRET"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
pkce = true
scopes = ["https://www.googleapis.com/auth/drive.readonly", "https://www.googleapis.com/auth/documents",
          "https://www.googleapis.com/auth/spreadsheets"]
extra_authorize = { access_type = "offline", prompt = "consent" }
help = "Takvim'le aynı Google OAuth istemcisi; projede Drive, Docs ve Sheets API'lerini etkinleştir"

# ------------------------------------------------------------------------------------------------ Drive
[actions.drive_search]
summary = "Drive'da dosya ara. q Drive sorgu dili: ör. name contains 'rapor', mimeType = 'application/vnd.google-apps.document' (Docs), 'application/vnd.google-apps.spreadsheet' (Sheets), modifiedTime > '2026-11-01T00:00:00'"
path = "/drive/v3/files"
query = { fields = "files(id,name,mimeType,modifiedTime,webViewLink)", orderBy = "modifiedTime desc" }
pick = "files"
fields = ["name", "id", "mimeType", "modifiedTime", "webViewLink"]
limit = 25
[actions.drive_search.params.q]
type = "string"
description = "Drive sorgusu; boş: son değişen dosyalar. Çöptekileri hariç tutmak için: trashed = false"
[actions.drive_search.params.pageSize]
type = "integer"
description = "En fazla dosya"
default = 20

[actions.drive_read]
summary = "Google Docs/Sheets/Slides dosyasını metin olarak oku (fileId drive_search'ten). Docs: text/plain, Sheets: text/csv (ilk sayfa), Slides: text/plain"
path = "/drive/v3/files/{fileId}/export"
[actions.drive_read.params.fileId]
type = "string"
required = true
description = "Dosya kimliği"
[actions.drive_read.params.mimeType]
type = "string"
description = "Dışa aktarma biçimi"
enum = ["text/plain", "text/csv", "text/markdown", "text/html"]
default = "text/plain"

# ------------------------------------------------------------------------------------------------- Docs
[actions.docs_create]
summary = "Yeni Google Docs belgesi oluştur (boş); sonra docs_append ile içerik ekle. Dönen documentId ile adres: https://docs.google.com/document/d/<id>/edit"
method = "POST"
path = "https://docs.googleapis.com/v1/documents"
writes = true
body = { title = "{title}" }
fields = ["documentId", "title"]
[actions.docs_create.params.title]
type = "string"
required = true
description = "Belge başlığı"
into = "template"

[actions.docs_append]
summary = "Google Docs belgesinin sonuna düz metin ekle (satır sonları korunur)"
method = "POST"
path = "https://docs.googleapis.com/v1/documents/{documentId}:batchUpdate"
writes = true
body = { requests = [{ insertText = { endOfSegmentLocation = {}, text = "{text}" } }] }
[actions.docs_append.params.documentId]
type = "string"
required = true
description = "Belge kimliği (drive_search ya da docs_create çıktısı)"
into = "path"
[actions.docs_append.params.text]
type = "string"
required = true
description = "Eklenecek metin; başa '\\n' koyarsan yeni paragrafta başlar"
into = "template"

# ------------------------------------------------------------------------------------------------ Sheets
[actions.sheets_create]
summary = "Yeni Google Sheets tablosu oluştur. Dönen spreadsheetUrl ile açılır."
method = "POST"
path = "https://sheets.googleapis.com/v4/spreadsheets"
writes = true
body = { properties = { title = "{title}" } }
fields = ["spreadsheetId", "spreadsheetUrl"]
[actions.sheets_create.params.title]
type = "string"
required = true
description = "Tablo başlığı"
into = "template"

[actions.sheets_read]
summary = "Tablodan aralık oku, ör. Sayfa1!A1:F50 (yalnız sayfa adı: bütün sayfa)"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}"
pick = "values"
limit = 200
[actions.sheets_read.params.spreadsheetId]
type = "string"
required = true
description = "Tablo kimliği"
[actions.sheets_read.params.range]
type = "string"
required = true
description = "A1 aralığı, ör. Sayfa1!A1:F50"

[actions.sheets_append]
summary = "Tablonun sonuna satır(lar) ekle; değerler kullanıcı yazmış gibi yorumlanır (sayı, tarih, formül)"
method = "POST"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}:append"
query = { valueInputOption = "USER_ENTERED", insertDataOption = "INSERT_ROWS" }
writes = true
fields = ["updates.updatedRange", "updates.updatedRows"]
[actions.sheets_append.params.spreadsheetId]
type = "string"
required = true
description = "Tablo kimliği"
[actions.sheets_append.params.range]
type = "string"
required = true
description = "Eklenecek sayfa/aralık, ör. Sayfa1!A1"
[actions.sheets_append.params.values]
type = "array"
required = true
description = "Satırlar: her satır bir liste, ör. [[\"Ali\", 12], [\"Ayşe\", 9]]"
into = "body"

[actions.sheets_update]
summary = "Aralıktaki hücreleri verilen değerlerle değiştir, ör. Sayfa1!B2:C3"
method = "PUT"
path = "https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}/values/{range}"
query = { valueInputOption = "USER_ENTERED" }
writes = true
fields = ["updatedRange", "updatedCells"]
[actions.sheets_update.params.spreadsheetId]
type = "string"
required = true
description = "Tablo kimliği"
[actions.sheets_update.params.range]
type = "string"
required = true
description = "Değiştirilecek aralık"
[actions.sheets_update.params.values]
type = "array"
required = true
description = "Satırlar: her satır bir liste"
into = "body"
