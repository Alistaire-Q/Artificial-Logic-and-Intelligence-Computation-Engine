<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="alice-token" content="{{TOKEN}}">
<title>ALICE</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="/static/icon.svg" alt="" class="brand-icon">
      <span>ALICE</span>
    </div>
    <button id="newChat" class="side-btn primary">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Yeni sohbet
    </button>
    <div class="side-title">Geçmiş</div>
    <div id="sessions"></div>
    <div class="side-foot">
      <button id="modelsBtn" class="side-btn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Modeller
      </button>
      <div class="ver" id="ver"></div>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <button id="toggleSide" class="icon-btn" title="Kenar çubuğu">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4v16" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="cwdBtn" class="cwd" title="Çalışma klasörünü değiştir">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span id="cwd">…</span>
      </button>
      <div class="spacer"></div>
      <div class="seg" id="modeSeg" title="İzin modu">
        <button data-mode="ask">Sor</button>
        <button data-mode="auto">Otomatik</button>
        <button data-mode="yolo">Tam erişim</button>
      </div>
    </header>

    <section id="chat">
      <div id="messages"></div>
      <div id="empty">
        <img src="/static/icon.svg" alt="" class="empty-icon">
        <h1>Ne yapalım?</h1>
        <p>Dosyalar, komutlar, ekran, tarayıcı. Bilgisayarında işi ALICE yapsın.</p>
        <div class="examples">
          <button class="ex">Bu klasördeki projeyi incele ve ne yaptığını özetle</button>
          <button class="ex">RAM'i en çok kullanan 5 programı göster</button>
          <button class="ex">Ekrana bak, şu an hangi pencereler açık?</button>
          <button class="ex">Bilgisayarımın donanımını çıkar, GPU sıcaklığına bak</button>
        </div>
      </div>
    </section>

    <footer>
      <div id="composer">
        <textarea id="input" rows="1" placeholder="ALICE'e bir iş ver…" spellcheck="false"></textarea>
        <button id="sendBtn" title="Gönder (Enter)">
          <svg class="i-send" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" width="14" height="14"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="hint">Enter gönder · Shift+Enter yeni satır · Esc durdur</div>
      <div id="statusbar">
        <span class="st" id="stModel" title="Şu an cevap veren model"><i class="dot"></i><b>…</b></span>
        <span class="st" id="stCtx" title="Context doluluğu (bu sınırda özetlenir)"><span class="bar"><span></span></span><b></b></span>
        <span class="st" id="stReq" title="Bugün yapılan istek"></span>
        <span class="st" id="stDec" title="Hızlı karar motoru"></span>
        <span class="st grow"></span>
        <span class="st" id="stBusy"></span>
      </div>
    </footer>
  </main>
</div>

<div id="overlay" hidden>
  <div class="dialog" id="dialog"></div>
</div>
</body>
</html>
