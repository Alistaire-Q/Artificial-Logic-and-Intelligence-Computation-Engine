name: CLA

# Checks that every pull request author has signed CLA.md. Signatures live on the cla-signatures branch so the
# protected main branch is never written to. pull_request_target is required to comment on PRs from forks; this
# workflow never checks out or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: hayatexe,dependabot[bot],github-actions[bot],Copilot,copilot-swe-agent[bot]
          lock-pullrequest-aftermerge: false
